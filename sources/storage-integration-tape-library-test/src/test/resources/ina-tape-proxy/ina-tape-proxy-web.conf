jettyConfig: jetty-config.xml

# =============================================================================
# MONGODB CONFIGURATION
# =============================================================================

mongoDbNodes:
  - dbHost: localhost
    dbPort: 27017
dbName: admin
dbAuthentication: false

# =============================================================================
# STATUS CONFIGURATION (static values returned by status endpoints)
# =============================================================================

libraryName: INA_LIBRARY
nbDrives: 1
nbSlots: 15

tapeMaxCapacityMB: 100


# Tape codes (seeded once at startup into tape_catalog)
tapeCodes:
  - TAPE_0001
  - TAPE_0002
  - TAPE_0003
  - TAPE_0004
  - TAPE_0005

# =============================================================================
# FILESYSTEM CONFIGURATION
# =============================================================================

exchangeDirectory: PLACE_HOLDER
inaStorageDirectory: PLACE_HOLDER
offerStorageDirectory: PLACE_HOLDER

# =============================================================================
# LATENCIES CONFIGURATION (milliseconds)
# =============================================================================

writeLatencyMs: 100
readLatencyMs: 100
loadLatencyMs: 100
unloadLatencyMs: 100
ejectLatencyMs: 100
roboticLatencyMs: 100
readTimeout: 10000
