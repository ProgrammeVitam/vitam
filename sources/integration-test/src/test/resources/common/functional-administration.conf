mongoDbNodes:
  - dbHost: localhost
    dbPort: 12346
dbName: vitam-test
dbUserName: user-metadata
dbPassword: user-metadata
jettyConfig: common/jetty-functional-admin-config-test.xml
workspaceUrl : http://localhost:8094
processingUrl: http://localhost:8097

clusterName: elasticsearch-data
elasticsearchNodes:
  - hostName: localhost
    httpPort: 9200

# ExternalId configuration
listEnableExternalIdentifiers:   
  0:
       - AGENCIES
       - CONTEXT
       - SECURITY_PROFILE
       - ACCESS_CONTRACT
       - INGEST_CONTRACT
       - PROFILE
       - ARCHIVE_UNIT_PROFILE
  1:
       - CONTEXT
       - SECURITY_PROFILE
       - ACCESS_CONTRACT
       - INGEST_CONTRACT
       - PROFILE
       - ARCHIVE_UNIT_PROFILE

accessionRegisterSymbolicThreadPoolSize: 4
ruleAuditThreadPoolSize: 4

customSearchOnFields:
  default_config:
    unit:
      fields:
        - fieldPath: Title
          types:
            - Strict
            - Minimal
    objectgroup:
      fields:
        - fieldPath: Title
          types:
            - Strict
            - Minimal

  dedicated_tenants:
    - tenants: '2'
      unit:
        fields:
          - fieldPath: Title
            types:
              - Strict
              - Minimal
          - fieldPath: Description
            types:
              - Strict

  grouped_tenants:
    - name: 'grp1'
      tenants: '0-1'
      unit:
        fields:
          - fieldPath: Title
            types:
              - Strict
          - fieldPath: Description
            types:
              - Minimal
      objectgroup:
        fields:
          - fieldPath: Metadata
            types:
              - Strict
              - Minimal
          - fieldPath: RawMetadata
            types:
              - Strict
