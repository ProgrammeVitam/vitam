# INA Tape Proxy Configuration

jettyConfig: jetty-config.xml

# =============================================================================
# INA_LIBRARY CONFIGURATION
# =============================================================================

libraryName: INA_LIBRARY
nbDrives: 1
nbSlots: 15
tapeMaxCapacityMB: 10 # 10 MB for local testing

# Tape codes (seeded once at startup into tape_catalog)
tapeCodes:
  - TAPE_0001
  - TAPE_0002
  - TAPE_0003
  - TAPE_0004
  - TAPE_0005
  - TAPE_0006
  - TAPE_0007
  - TAPE_0008
  - TAPE_0009
  - TAPE_0010
  - TAPE_0011
  - TAPE_0012
  - TAPE_0013
  - TAPE_0014
  - TAPE_0015

# =============================================================================
# FILESYSTEM CONFIGURATION
# =============================================================================

exchangeDirectory: /vitam/data/ina-tape-proxy/exchange
inaStorageDirectory: /vitam/data/ina-tape-proxy/storage
offerStorageDirectory: /vitam/data/offer3

# =============================================================================
# MONGODB CONFIGURATION
# =============================================================================

mongoDbNodes:
  - dbHost: localhost
    dbPort: 27017
dbName: ina-tape-proxy
dbAuthentication: true
dbUserName: ina-tape-proxy
dbPassword: azerty10



# ========== LATENCIES CONFIGURATION (milliseconds) ==========

writeLatencyMs:   3_000 # 3 seconds
readLatencyMs:    6_000 # 6 seconds
readTimeout:     30_000 # 30 seconds
loadLatencyMs:    2_000 # 2 seconds
unloadLatencyMs:  2_000 # 2 seconds
ejectLatencyMs:   2_000 # 2 seconds
roboticLatencyMs: 2_000 # 2 seconds (move, rewind, goto...)
