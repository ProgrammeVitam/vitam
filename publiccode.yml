description:
  en:
    shortDescription: Digital Archives Management System developed by the French government
    longDescription: >
      Vitam is an open-source digital archives management system developed
      by the French government as part of the Programme interministeriel
      archives numeriques. It provides a scalable back-office solution for
      ingesting, storing, preserving and accessing large volumes of digital
      archives. Vitam is designed to be integrated into existing information
      systems and can handle billions of objects. It implements the OAIS
      standard and supports SEDA-compliant archival workflows.
    documentation: "https://www.programmevitam.fr/vitam-doc/fr/master/index.html"
    features:
      - Ingest and store digital archives at scale
      - OAIS and SEDA compliance
      - Metadata and lifecycle management
      - Access control and audit trails
      - Multi-tenant architecture
