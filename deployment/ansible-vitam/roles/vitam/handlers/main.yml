---

- name: vitam - restart service
  systemd:
    name: "{{ package_name }}"
    state: restarted
    daemon_reload: true
  when: ( primary_site | bool ) or
        ( vitam_struct.vitam_component in vitam_secondary_site_components )

- name: vitam - reload consul configuration
  systemd:
    name: vitam-consul
    state: reloaded
  when: not consul_disabled | default(false) | bool
