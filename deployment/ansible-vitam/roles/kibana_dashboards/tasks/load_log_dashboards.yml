---

- name: Load dashboards into Kibana-Log
  run_once: true
  tags: load_kibana
  uri:
    url: "http://{{ ip_admin }}:{{ composant.port }}/api/saved_objects/_import?overwrite=true"
    method: POST
    headers:
      kbn-xsrf: "true"
    body_format: form-multipart
    body:
      file:
        content: "{{ lookup('file', role_path + '/files/' + composant.groupe + '/dashboard/' + item) }}"
        filename: "{{ item }}"
    timeout: "{{ composant.api_call_timeout }}"
  loop: >
    {{
      [
        'alertes-de-securite-dashboard.ndjson',
        'Composants-Vitam.ndjson',
        'mongodb-es-synchro-errors-dashboard.ndjson',
        'Storage-Offre-average-time.ndjson'
      ] + (['Access-Vitam.ndjson'] if syslog.name | default('filebeat') == "filebeat" else [])
    }}
