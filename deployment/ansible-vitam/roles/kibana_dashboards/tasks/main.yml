---

#### Kibana dashboards configuration ####
- name: Wait for the kibana port to be open
  wait_for:
    host: "{{ ip_admin }}"
    port: "{{ composant.port }}"
    timeout: "{{ vitam_defaults.services.start_timeout }}"
  run_once: true
  tags: "load_kibana"

- name: Wait until kibana service is OK
  uri:
    url: 'http://{{ ip_admin }}:{{ composant.port }}/status'
    method: GET
  register: kibana_result
  until: kibana_result.status == 200
  retries: "{{ composant.api_call_timeout }}"
  delay: 10
  tags: load_kibana

- name: Load Kibana-Data dashboards
  include_tasks: load_data_dashboards.yml
  when: composant.groupe == 'data'

- name: Load dashboards into Kibana-Log
  run_once: true
  tags: load_kibana
  uri:
    url: "http://{{ ip_admin }}:{{ composant.port }}/api/saved_objects/_import?overwrite=true"
    method: POST
    headers:
      kbn-xsrf: "true"
    body_format: form-multipart
    body:
      file:
        content: "{{ lookup('file', item) }}"
        filename: "{{ item | basename }}"
    timeout: "{{ composant.api_call_timeout }}"
  with_fileglob:
    - "{{ role_path }}/files/log/dashboard/*.ndjson"
  when: composant.groupe == 'log'

- name: "set {{ composant.default_index_pattern }} as kibana default index pattern"
  tags: load_kibana
  run_once: true
  uri:
    url: "http://{{ ip_admin }}:{{ composant.port }}/api/index_patterns/default"
    method: POST
    body: "{\"index_pattern_id\":\"{{ composant.default_index_pattern }}\", \"force\": true}"
    headers:
      kbn-xsrf: "true"
    body_format: json
    timeout: "{{ composant.api_call_timeout }}"
    status_code: 200, 201
  register: kibana_result
  until: kibana_result.status in [200,201]
  retries: "{{ kibana.import_retries }}"
  delay: "{{ kibana.import_delay }}"
