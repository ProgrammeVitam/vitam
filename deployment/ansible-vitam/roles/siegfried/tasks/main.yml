---

- name: Install vitam-siegfried package
  package:
    name: vitam-siegfried
    state: latest
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"
  notify:
    - "siegfried - restart service"
  when: install_mode != "container"

- name: Deploy systemd service file for siegfried
  template:
    src: "vitam-{{ 'container-' if install_mode == 'container' else '' }}siegfried.service.j2"
    dest: "{{ '/lib/systemd/system' if ansible_os_family == 'Debian' else '/usr/lib/systemd/system' }}/vitam-siegfried.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - "siegfried - restart service"

- block:

    - name: Check Siegfried signature file
      stat:
        path: "{{ vitam_defaults.folder.root_path }}/app/siegfried/default.sig"
      register: siegfried_signature

    - name: Initialize Siegfried signature file (containerized)
      shell: >
        /usr/bin/docker run --rm --net=host
        -v "{{ vitam_defaults.folder.root_path }}/app/siegfried:{{ vitam_defaults.folder.root_path }}/app/siegfried:rw"
        {{ container_repository.registry_url }}/vitam-external/ghcr.io/keeps/siegfried:v1.11.2
        sf -update -home {{ vitam_defaults.folder.root_path }}/app/siegfried
      when: not siegfried_signature.stat.exists

  when: install_mode == "container"

#### Configuration ####

- name: Check that the directories exist
  file:
    path: "{{ vitam_defaults.folder.root_path }}/{{ item }}/siegfried"
    state: directory
    owner: "{{ vitam_defaults.users.vitam }}"
    group: "{{ vitam_defaults.users.group }}"
    mode: "{{ '0777' if install_mode == 'container' else vitam_defaults.folder.folder_permission }}"
  with_items:
    - app
    - bin
    - conf
    - log
  notify:
    - "siegfried - restart service"

- name: Copy siegfried sysconfig file
  template:
    src: sysconfig.conf.j2
    dest: "{{ vitam_defaults.folder.root_path }}/conf/siegfried/sysconfig.conf"
    owner: "{{ vitam_defaults.users.vitam }}"
    group: "{{ vitam_defaults.users.group }}"
    mode: "{{ '0644' if install_mode == 'container' else vitam_defaults.folder.script_permission }}"
  notify:
    - "siegfried - restart service"

- name: Flush handlers
  meta: flush_handlers

- name: Ensure siegfried is started at boot
  service:
    name: vitam-siegfried
    enabled: "{{ siegfried.at_boot | default(service_at_boot) }}"
    state: started
