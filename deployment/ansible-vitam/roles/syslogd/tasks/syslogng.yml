---

- name: ensure syslog-ng package is installed
  package:
    name: syslog-ng
    state: latest
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"
  notify:
    - "syslogng - restart service"

- name: copy VITAM transport config file
  template:
    src: syslog.conf.j2
    dest: /etc/syslog-ng/conf.d/vitam.conf
    owner: root
    mode: 0644
  when:
    - groups['hosts_logstash'] | length > 0 or external_siem is defined
    - not consul_disabled | default(false) | bool
  notify:
    - "syslogng - restart service"

- meta: flush_handlers

- name: ensure service is started on boot && restart service
  service:
    name: syslog-ng
    enabled: true
    state: started
