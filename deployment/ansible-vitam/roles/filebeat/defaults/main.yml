---

filebeat_version: "{{ filebeat.version | default('8.18.0') }}"
filebeat_package: "filebeat{{ '=' if ansible_os_family == 'Debian' else '-' }}{{ filebeat_version }}"

cots_list:
  - consul
  # - cerebro
  # - grafana
  # - prometheus
  # - alertmanager

filebeat:
  processors:
    - add_host_metadata:
        when.not.contains.tags: forwarded
  config:
    ignore_older: "24h"
  system:
    enable_log: false
    enable_auth: false
  cots:
    consul:
      enable_log: true
    antivirus:
      enable_scan: false
      enable_log: false
    kibana_data:
      enable_log: true
      enable_audit: true
    kibana_log:
      enable_log: true
      enable_audit: true
    logstash:
      enable_log: true
    elasticsearch_data:
      enable_server: true
      enable_audit: true
      enable_slowlog: true
      enable_deprecation: false
    elasticsearch_log:
      enable_server: true
      enable_audit: true
      enable_slowlog: true
      enable_deprecation: false
    apache:
      enable_access: true
      enable_log: true
    mongodb_offer:
      mongos:
        enable_log: true
      mongoc:
        enable_log: true
      mongod:
        enable_log: true
    mongodb_data:
      mongos:
        enable_log: true
      mongoc:
        enable_log: true
      mongod:
        enable_log: true
