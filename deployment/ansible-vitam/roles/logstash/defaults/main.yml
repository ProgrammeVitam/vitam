---

# HOTFIX: Workaround for logstash package which is actually a "1:9.3.2-1" on Debian, and "9.3.2" for Redhat-family
logstash_version: "{{ '1:' if ansible_os_family == 'Debian' else '' }}{{ logstash.version | default('9.3.2') }}{{ '-1' if ansible_os_family == 'Debian' else '' }}"
logstash_package: "logstash{{ '=' if ansible_os_family == 'Debian' else '-' }}{{ logstash_version }}"

logstash_user: "{{ logstash.user | default('logstash') }}"

logstash_port: "{{ logstash.port | default(10514) }}"
