---

logstash_log_dir: "{{ vitam_defaults.folder.root_path }}/log/logstash"
logstash_tmp_dir: "{{ vitam_defaults.folder.root_path }}/tmp/logstash"
logstash_conf_dir: "{{ vitam_defaults.folder.root_path }}/conf/logstash"
logstash_data_dir: "{{ vitam_defaults.folder.root_path }}/data/logstash"

# ----------------------------------------------
# To be adapted according to ElasticSearch version
logstash_patterns_core_version: '4.3.4'
# ----------------------------------------------

service_at_boot: "{{ vitam_defaults.services.at_boot | default(false) }}"
