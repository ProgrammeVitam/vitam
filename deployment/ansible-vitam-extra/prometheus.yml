---

- hosts: hosts_prometheus
  gather_facts: false
  roles:
    - prometheus-server
  tags:
    - prometheus_server
    - update_prometheus_configuration

- hosts: hosts_alertmanager
  gather_facts: false
  roles:
    - prometheus-alertmanager
  tags:
    - alertmanager
    - update_prometheus_configuration

### PROMETHEUS NODE EXPORTER / CONSUL EXPORTER INSTALLATION OR UNINSTALL ###
- hosts: vitam
  gather_facts: false
  any_errors_fatal: true
  roles:
    - prometheus-node-exporter
    - role: prometheus-consul-exporter
      when: not consul_disabled | default(false) | bool
  tags:
    - prometheus-exporter

### PROMETHEUS ELASTICSEARCH EXPORTER INSTALLATION OR UNINSTALL ###
- hosts: elasticsearch
  gather_facts: false
  any_errors_fatal: true
  roles:
    - prometheus-elasticsearch-exporter
  tags:
    - prometheus-exporter

### PROMETHEUS BLACKBOX EXPORTER INSTALLATION OR UNINSTALL ###
- hosts: hosts_prometheus
  gather_facts: false
  any_errors_fatal: true
  roles:
    - prometheus-blackbox-exporter
  tags:
    - prometheus-exporter

### PROMETHEUS MONGODB EXPORTER INSTALLATION OR UNINSTALL ###
- hosts: hosts_mongoc_offer,hosts_mongod_offer,hosts_mongoc_data,hosts_mongod_data
  gather_facts: false
  any_errors_fatal: true
  roles:
    - prometheus-mongodb-exporter
  tags:
    - prometheus-exporter
